[workspace]
resolver = "3"

[package]
name = "ice_warfare"
version = "0.1.0"
edition = "2024"

[dependencies]
leafwing-input-manager = "0.20.0"
avian3d = { git = "https://github.com/Jondolf/avian", branch = "bevy-0.18", features = [
    "simd",
] }

itertools = "0.14.0"
strum = { version = "0.27.2", features = [ "derive", "strum_macros" ] }
eyre = "0.6.12"
tiny_bail = "0.7.0"

[dependencies.bevy]
default-features = false
version = "0.18"
features = [
    "dynamic_linking",
    "wayland",
    "3d",
    "bevy_pbr",
    # "file_watcher",
    # "asset_processor",
    # "webp",
    # "jpeg",
    "bevy_dev_tools",
    "bevy_remote",
    # "bevy_solari",
]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
irrefutable_let_patterns = "allow"
